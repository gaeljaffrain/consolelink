[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consolelink"
dynamic = ["version"]
description = "Live view of an ETC SmartFade ML lighting console over USB, with optional Art-Net output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyusb"]  # libusb itself is a native library: see README (Requirements)

[project.optional-dependencies]
menubar = [  # the menu-bar app (consolelink-menubar); installs nothing off macOS
    "rumps; sys_platform == 'darwin'",
    "keyring; sys_platform == 'darwin'",
]
dev = ["pytest", "bump-my-version"]

[project.scripts]
consolelink = "consolelink.app:main"
consolelink-menubar = "consolelink.menubar:main"

[tool.setuptools.dynamic]
version = {attr = "consolelink.protocol.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consolelink = ["static/*", "menubar_icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# `bump-my-version bump patch|minor|major` edits VERSION, commits and tags (see README, Releasing).
[tool.bumpversion]
current_version = "0.1.4"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Version {new_version}"
# Releases are cut from main only: aborts before any file is touched on another branch.
setup_hooks = ["python scripts/require_main_branch.py"]

[[tool.bumpversion.files]]
filename = "src/consolelink/protocol.py"
search = 'VERSION = "{current_version}"'
replace = 'VERSION = "{new_version}"'

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consolelink"
dynamic = ["version"]
description = "Web interface and Art-Net output for ETC SmartFade ML lighting consoles, over USB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaël Jaffrain" }]
keywords = ["lighting", "dmx", "art-net", "etc", "smartfade", "usb", "console"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia",
]
dependencies = ["pyusb"]  # libusb itself is a native library: see README (Requirements)

[project.optional-dependencies]
menubar = [  # the menu-bar app (consolelink-menubar); installs nothing off macOS
    "rumps; sys_platform == 'darwin'",
    "keyring; sys_platform == 'darwin'",
]
dev = ["pytest", "bump-my-version", "build", "twine"]

[project.urls]
Homepage = "https://github.com/gaeljaffrain/consolelink"
Repository = "https://github.com/gaeljaffrain/consolelink"
Issues = "https://github.com/gaeljaffrain/consolelink/issues"

[project.scripts]
consolelink = "consolelink.app:main"
consolelink-menubar = "consolelink.menubar:main"

[tool.setuptools.dynamic]
version = {attr = "consolelink.protocol.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consolelink = ["static/*", "menubar_icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# `bump-my-version bump patch|minor|major` edits VERSION, commits and tags (see README, Releasing).
[tool.bumpversion]
current_version = "0.1.6"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Version {new_version}"
# Releases are cut from main only: aborts before any file is touched on another branch.
setup_hooks = ["python scripts/require_main_branch.py"]

[[tool.bumpversion.files]]
filename = "src/consolelink/protocol.py"
search = 'VERSION = "{current_version}"'
replace = 'VERSION = "{new_version}"'

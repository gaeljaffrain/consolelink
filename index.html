<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConsoleLink for SmartFadeML - Playback</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ConsoleLink for SmartFadeML — Playback</h1>
  <div class="subtitle">Console live view over USB.</div>

  <div class="status-row">
    <div class="status"><span class="dot" id="dot"></span><span id="conn-text">connecting…</span></div>
    <div class="mode-pill" id="mode-pill">mode: —</div>
    <div id="stale-text" style="color: var(--dim);"></div>
  </div>

  <div class="section section-row" id="section-master-bumps">
    <div class="section-title">MAIN</div>
    <div class="special-row">
      <div class="fader special-fader" id="fader-master">
        <div class="number">MASTER</div>
        <div class="value-row">
          <div class="track"><div class="fill master" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="ind-button ind-mini placeholder blackout" id="ind-blackout">
            <div class="light">BLACK OUT</div>
          </div>
        </div>
      </div>
      <div class="fader special-fader" id="fader-bumps">
        <div class="number">BUMPS</div>
        <div class="value-row">
          <div class="track"><div class="fill bumps" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="ind-button ind-mini placeholder" id="ind-solo">
            <div class="light">SOLO</div>
          </div>
        </div>
      </div>
      <div class="fader special-fader" id="fader-ind1">
        <div class="number">IND 1</div>
        <div class="value-row">
          <div class="track"><div class="fill ind" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="ind-button ind-mini placeholder" id="ind-1">
            <div class="light">?</div>
          </div>
        </div>
      </div>
      <div class="fader special-fader" id="fader-ind2">
        <div class="number">IND 2</div>
        <div class="value-row">
          <div class="track"><div class="fill ind" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="ind-button ind-mini placeholder" id="ind-2">
            <div class="light">?</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section section-row" id="section-INT A">
    <div class="section-title">INT A <span class="live-badge" style="display:none">LIVE</span></div>
    <div class="fader-row" id="faders-INT A"></div>
  </div>

  <div class="section section-row" id="section-INT B">
    <div class="section-title">INT B <span class="live-badge" style="display:none">LIVE</span></div>
    <div class="fader-row" id="faders-INT B"></div>
  </div>

  <div class="section section-row" id="section-DEVICE INT">
    <div class="section-title">INT DEV <span class="live-badge" style="display:none">LIVE</span></div>
    <div class="fader-row" id="faders-DEVICE INT"></div>
  </div>

<script>
const MODES = ["INT A", "INT B", "DEVICE INT"];

function buildFaders(mode) {
  const row = document.getElementById("faders-" + mode);
  for (let i = 1; i <= 24; i++) {
    const f = document.createElement("div");
    f.className = "fader";
    f.id = "fader-" + mode + "-" + i;
    f.innerHTML = `
      <div class="number">${i}</div>
      <div class="value-row">
        <div class="track"><div class="fill" style="height:0%"></div></div>
        <div class="val">0</div>
      </div>
      <div class="name"></div>`;
    row.appendChild(f);
  }
}
MODES.forEach(buildFaders);

function pct(v) { return Math.round((v / 255) * 100); }

// Console convention: 100% reads as "F" (Full), never "100". No % sign anywhere.
function pctLabel(v) {
  const p = pct(v);
  return p === 100 ? "F" : String(p);
}

function setFader(el, value) {
  if (!el) return;
  const fill = el.querySelector(".fill");
  const val = el.querySelector(".val");
  fill.style.height = pct(value) + "%";
  val.textContent = pctLabel(value);
  el.classList.toggle("nonzero", value > 0);
}

// state is null until the first type=0x0c message arrives (still "placeholder" until then),
// then true/false. keepLabel is for buttons like SOLO/BLACKOUT whose .light already has a
// permanent text label in the HTML -- skip overwriting it with the "?"/empty placeholder text
// used by IND 1/2, whose own label lives in a separate .number/.name pair instead.
function setIndicator(el, state, keepLabel) {
  if (!el) return;
  el.classList.toggle("placeholder", state === null);
  el.classList.toggle("on", state === true);
  if (!keepLabel) {
    el.querySelector(".light").textContent = state === null ? "?" : "";
  }
}

// IND 1/2 are a fader (live 0-255 value, like Master/Bumps) plus a click button showing the
// Independent's patched name. `value` and `clicked` are two genuinely separate bits on the
// wire (RE notes Part 39/40, confirmed against a real capture): `value` is a stored/preset
// level that stays constant regardless of click state -- it does NOT drop to 0 on its own --
// while `clicked` is whether that level is currently reaching output. So the bar shows
// `clicked ? value : 0`, the same "stored level only reaches output while engaged" pattern
// already confirmed for Bump buttons (Part 16), not the raw value unconditionally.
function setIndependent(faderEl, btnEl, value, clicked, label) {
  setFader(faderEl, (value === null || clicked !== true) ? 0 : value);
  const known = clicked !== null;
  btnEl.classList.toggle("placeholder", !known);
  btnEl.classList.toggle("on", known && clicked === true);
  btnEl.querySelector(".light").textContent = known ? (label || "") : "?";
}

let lastUpdate = 0;

function render(state) {
  const dot = document.getElementById("dot");
  const connText = document.getElementById("conn-text");
  dot.classList.toggle("ok", state.connected);
  connText.textContent = state.connected ? "connected" : "waiting for console…";

  const pill = document.getElementById("mode-pill");
  const modeClass = state.fader_mode === "INT A" ? "active-A" : state.fader_mode === "INT B" ? "active-B" : "active-D";
  pill.className = "mode-pill " + modeClass + (state.fader_mode_confirmed ? "" : " unconfirmed");
  pill.textContent = "mode: " + state.fader_mode + (state.fader_mode_confirmed ? "" : " (assumed default)");

  MODES.forEach(mode => {
    const badge = document.querySelector("#section-" + CSS.escape(mode) + " .live-badge");
    const isActive = mode === state.fader_mode;
    badge.style.display = isActive ? "inline-block" : "none";
    document.getElementById("section-" + mode).classList.toggle("dim", !isActive);
    for (let i = 1; i <= 24; i++) {
      const el = document.getElementById("fader-" + mode + "-" + i);
      setFader(el, state.faders[mode][i - 1]);
      const label = state.labels?.[mode]?.[i] || "";
      el.querySelector(".number").textContent = String(i);
      el.querySelector(".name").textContent = label;
    }
  });

  setFader(document.getElementById("fader-master"), state.master);
  setFader(document.getElementById("fader-bumps"), state.bumps);

  setIndependent(document.getElementById("fader-ind1"), document.getElementById("ind-1"),
    state.independent1, state.independent1_clicked, state.independent_labels?.[1]);
  setIndependent(document.getElementById("fader-ind2"), document.getElementById("ind-2"),
    state.independent2, state.independent2_clicked, state.independent_labels?.[2]);
  setIndicator(document.getElementById("ind-solo"), state.solo, true);
  setIndicator(document.getElementById("ind-blackout"), state.blackout, true);

  lastUpdate = state.last_update;
}

// Pushed via Server-Sent Events rather than polled: every state change the server
// decodes is sent immediately, so no fader update is silently skipped between polls.
function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = (ev) => render(JSON.parse(ev.data));
  es.onerror = () => {
    document.getElementById("dot").classList.remove("ok");
    document.getElementById("conn-text").textContent = "server unreachable, retrying…";
    // EventSource auto-retries the connection itself; nothing else to do here.
  };
}
connect();

setInterval(() => {
  const staleEl = document.getElementById("stale-text");
  if (!lastUpdate) return;
  const age = Date.now() / 1000 - lastUpdate;
  staleEl.textContent = age > 3 ? `last update ${age.toFixed(0)}s ago` : "";
}, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConsoleLink</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="title-row">
    <h1>ConsoleLink</h1>
    <button class="gear-btn" id="settings-btn" type="button" aria-label="Settings"
            aria-haspopup="dialog" aria-controls="settings-overlay" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="status-row">
    <div class="status-group">
      <div class="status"><span class="dot" id="dot"></span><span id="conn-text">connecting…</span></div>
      <div id="stale-text"></div>
    </div>
  </div>

  <div class="tab-bar" role="tablist">
    <button class="tab" id="tab-btn-playback" role="tab" aria-selected="true" aria-controls="tab-playback">Playback</button>
    <button class="tab" id="tab-btn-dmx" role="tab" aria-selected="false" aria-controls="tab-dmx">DMX Outputs</button>
  </div>

  <div id="tab-playback" role="tabpanel">
  <div class="section section-row" id="section-master-bumps">
    <div class="section-title">MAIN</div>
    <div class="special-row">
      <div class="meter special-meter" id="fader-master">
        <div class="meter-label">MASTER</div>
        <div class="value-row">
          <div class="track"><div class="fill master" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="console-button placeholder" id="btn-blackout" data-button="blackout">
            <div class="light">BLACK OUT</div>
          </div>
        </div>
      </div>
      <div class="meter special-meter" id="bumps">
        <div class="meter-label">BUMPS</div>
        <div class="value-row">
          <div class="track"><div class="fill bumps" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="console-button placeholder" id="btn-solo" data-button="solo">
            <div class="light">SOLO</div>
          </div>
        </div>
      </div>
      <div class="meter special-meter" id="ind1">
        <div class="meter-label">IND 1</div>
        <div class="value-row">
          <div class="track"><div class="fill" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="console-button placeholder" id="btn-ind1" data-button="ind1">
            <div class="light">
              <div class="name-line"></div>
              <div class="name-line"></div>
              <div class="name-line"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="meter special-meter" id="ind2">
        <div class="meter-label">IND 2</div>
        <div class="value-row">
          <div class="track"><div class="fill" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
        <div class="name">
          <div class="console-button placeholder" id="btn-ind2" data-button="ind2">
            <div class="light">
              <div class="name-line"></div>
              <div class="name-line"></div>
              <div class="name-line"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="meter special-meter" id="xfade-live">
        <div class="meter-label">LIVE</div>
        <div class="value-row">
          <div class="track"><div class="fill" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
      </div>
      <div class="meter special-meter" id="xfade-next">
        <div class="meter-label">NEXT</div>
        <div class="value-row">
          <div class="track"><div class="fill" style="height:0%"></div></div>
          <div class="val">0</div>
        </div>
      </div>
      <div class="group-bar" style="grid-column: 3 / 5;">INDEPENDENTS</div>
      <div class="group-bar" style="grid-column: 5 / 7;">CROSSFADER</div>
      <div class="lcd placeholder" id="lcd-1">
        <div class="lcd-label">LCD 1</div>
        <div class="lcd-line"></div>
        <div class="lcd-line"></div>
      </div>
      <div class="lcd placeholder" id="lcd-2">
        <div class="lcd-label">LCD 2</div>
        <div class="lcd-line"></div>
        <div class="lcd-line"></div>
      </div>
    </div>
  </div>

  <div class="section section-row" id="section-INT A">
    <div class="section-title">INT A <span class="active-badge" style="display:none">Active</span></div>
    <div class="intensity-row" id="intensities-INT A"></div>
  </div>

  <div class="section section-row" id="section-INT B">
    <div class="section-title">INT B <span class="active-badge" style="display:none">Active</span></div>
    <div class="intensity-row" id="intensities-INT B"></div>
  </div>

  <div class="section section-row" id="section-INT DEV">
    <div class="section-title">INT DEV <span class="active-badge" style="display:none">Active</span></div>
    <div class="intensity-row" id="intensities-INT DEV"></div>
  </div>

  <div class="section section-row" id="section-physical">
    <div class="section-title">FADERS
      <div class="mode-pill" id="mode-pill">—</div>
      <label class="page-control">PAGE <select id="mems-page"></select></label>
      <div class="page-badge" id="mems-page-badge">PAGE —</div>
    </div>
    <div class="intensity-row" id="physical-faders"></div>
  </div>
  </div>

  <div id="tab-dmx" role="tabpanel" hidden>
    <div class="dmx-note" id="dmx-note">waiting for DMX data…</div>
    <div class="section" id="dmx-universe-1">
      <div class="section-title">Universe 1</div>
      <div class="dmx-grid"></div>
    </div>
    <div class="section" id="dmx-universe-2">
      <div class="section-title">Universe 2</div>
      <div class="dmx-grid"></div>
    </div>
  </div>

  <div class="overlay" id="settings-overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button class="close-btn" id="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>
      <label class="setting sat-control">Colors
        <span class="sat-slider"><span>Soft</span>
          <input type="range" id="saturation" min="0.5" max="1" step="0.05">
          <span>Native</span></span>
      </label>
      <label class="setting int-ab-control"><input type="checkbox" id="show-int-ab"> Show INT A/B</label>
      <div class="settings-foot">ConsoleLink <span id="version"></span></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
